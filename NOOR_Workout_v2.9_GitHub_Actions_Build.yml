name: Build NOOR Workout v2.9 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NOOR_Workout_v2.9_GitHub_Ready.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract NOOR Android source
        run: |
          mkdir -p project
          unzip -q NOOR_Workout_v2.9_GitHub_Ready.zip -d project
          test -f project/settings.gradle.kts
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build NOOR debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-Workout-v2.9-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
