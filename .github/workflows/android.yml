name: Build NOOR Workout v2.9 APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract project
        run: |
          unzip -q NOOR_Workout_v2.9_GitHub_Ready.zip -d project
          test -f project/settings.gradle.kts
      - name: Build APK
        run: cd project && gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NOOR-Workout-v2.9-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
